<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カード帳">
<link rel="manifest" href="manifest.webmanifest">
<title>AIKATSU! ENCORE カード帳</title>
<style>
:root{--bg:#07060b;--panel:#121019;--panel2:#19141f;--line:#584563;--silver:#eeeaf4;--muted:#a9a0b2;--violet:#a968ff;--violet2:#d39cff;--pink:#ff7bd4;--green:#68e1d0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#050509;color:var(--silver);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px;background:radial-gradient(circle at 50% -5%,#3a214e,#100a16 34%,#050509 82%)}
header{padding:18px 14px 11px;display:flex;justify-content:space-between;align-items:center}.brand small{display:block;color:#cdbddd;font-size:10px;letter-spacing:.16em}.brand b{font-size:23px;text-shadow:0 0 16px #a75cff}.count{border:1px solid #8d7a9b;border-radius:18px;padding:7px 11px;background:#121018}.count strong{font-size:20px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:0 9px 11px;padding:4px;background:#100d15;border:1px solid #49384f;border-radius:24px}.tabs button{border:0;background:transparent;color:#a79cac;border-radius:20px;padding:9px 2px;font-weight:900}.tabs button.active{background:linear-gradient(135deg,#7140b6,#bd75ff);color:#fff;box-shadow:0 0 18px #a65cff66}
main{padding:0 9px}.panel{background:#0f0d14e8;border:1px solid #3e3147;border-radius:22px;padding:12px;box-shadow:0 12px 35px #000b}.searchrow{display:flex;gap:8px;margin-bottom:9px}.search{flex:1;background:#111018;color:#eee;border:1px solid #55435f;border-radius:22px;padding:11px 14px;outline:none}.filter{background:#15111b;color:#d7c9df;border:1px solid #55435f;border-radius:22px;padding:0 12px}
.line{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.line small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:#15121b;border:1px solid #71617e;border-radius:16px;overflow:hidden;box-shadow:0 8px 18px #000a}.card button{display:block;width:100%;padding:0;text-align:left;border:0;background:none;color:inherit}.cardpic{height:180px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 40% 25%,#655b6e,#2a2232 48%,#08070b)}.cardpic:after{content:"";position:absolute;inset:11px;border:1px solid #d9cde2aa;border-radius:11px;box-shadow:0 0 20px #a968ff55 inset}.spark{font-size:57px;color:#d8b0ff;text-shadow:0 0 25px #ad5cff}.tag{position:absolute;z-index:2;top:7px;border:1px solid #d9cbe4;background:#18131ecc;border-radius:12px;padding:4px 7px;font-size:10px;font-weight:900}.rar{right:7px}.have{left:7px}.ci{padding:8px}.ci b{display:block;font-size:12px;min-height:30px}.ci small{display:block;color:#9e93a7;font-size:10px;margin-top:2px}.qty{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.qty button{width:30px;height:28px;border-radius:10px;background:#251d2e;border:1px solid #624d70;color:#d4a9ff;font-size:19px}
.empty{text-align:center;color:#aaa0b0;padding:35px 8px}.seg{display:flex;background:#19151f;border-radius:20px;padding:4px;margin-bottom:11px}.seg button{flex:1;background:none;border:0;color:#aaa0b1;border-radius:17px;padding:10px;font-weight:900}.seg button.active{background:#7542bd;color:#fff}
.button{width:100%;border:0;padding:13px;border-radius:17px;background:linear-gradient(135deg,#7644bd,#c077ff);color:#fff;font-weight:900;box-shadow:0 0 18px #9c59f655}.secondary{width:100%;padding:12px;border-radius:17px;background:#1a1520;color:#d4a9ff;border:1px solid #584663;font-weight:900}
.qrbox{height:300px;border:1px solid #54425f;border-radius:20px;background:#0b0910;display:grid;place-items:center;text-align:center}.frame{width:68%;height:155px;border:2px solid #bd79ff;border-radius:18px;display:grid;place-items:center;font-size:52px;box-shadow:0 0 25px #a65cff55}.history{display:grid;gap:8px}.hist{display:flex;gap:10px;align-items:center;padding:10px;background:#141119;border:1px solid #33283b;border-radius:14px}.thumb{width:40px;height:52px;border-radius:7px;background:linear-gradient(145deg,#6b5879,#15111b);display:grid;place-items:center}.hist small{display:block;color:#9e93a6;margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;text-align:center;background:#15121b;border:1px solid #39303f;border-radius:14px}.stat strong{display:block;font-size:20px}.stat small{color:#9e93a7}.ring{width:175px;height:175px;margin:8px auto 15px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#bf79ff 0 2.4%,#2b2631 2.4% 100%);position:relative}.ring:after{content:"";position:absolute;inset:15px;background:#0e0c12;border-radius:50%}.ring span{position:relative;z-index:1;font-size:22px;font-weight:900;text-align:center}
.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 9px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08070d 30%)}.bottom button{border:1px solid #34283d;border-radius:14px;padding:7px 2px;background:#100d15;color:#a69aaa;font-size:10px}.bottom button.active{border-color:#9b68c9;color:#fff}.bottom b{display:block;font-size:17px}.fab{position:fixed;right:17px;bottom:78px;width:55px;height:55px;border-radius:50%;border:1px solid #ead9ff;background:linear-gradient(135deg,#7544bb,#c17aff);color:#fff;font-size:28px;z-index:9;box-shadow:0 0 25px #9e5eff88}
.modal{position:fixed;z-index:30;inset:0;background:#000c;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:#110e16;border:1px solid #6b5577;border-bottom:0;border-radius:25px 25px 0 0;padding:15px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{width:37px;height:37px;border-radius:50%;background:#24202a;border:1px solid #51445b;color:#fff}.form{display:grid;gap:9px}.form input,.form select{width:100%;background:#17141d;color:#eee;border:1px solid #493b54;border-radius:15px;padding:12px;outline:none}.cardhero{height:280px;border-radius:18px;background:radial-gradient(circle at 40% 25%,#786d7e,#2b2234 48%,#09070c);display:grid;place-items:center;border:1px solid #d8c9e2;box-shadow:0 0 25px #9e5eff55 inset}.cardhero span{font-size:85px;color:#d8adff;text-shadow:0 0 35px #a75cff}.muted{color:#9e93a7;font-size:12px}
@media(max-width:430px){.cardpic{height:165px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><small>AIKATSU! ENCORE</small><b>カード帳 ✦</b></div><div class="count"><strong id="ownedCount">0</strong> / 85 種</div></header>
<nav class="tabs"><button data-page="cards" class="active">カード</button><button data-page="trade">譲・求</button><button data-page="qr">QR</button><button data-page="history">履歴</button></nav>
<main id="main"></main>
<nav class="bottom"><button data-page="home"><b>⌂</b>ホーム</button><button data-page="cards" class="active"><b>♡</b>カード</button><button id="addBtn"><b>＋</b>追加</button><button data-page="history"><b>☷</b>履歴</button></nav>
<button class="fab" id="fab">＋</button>
</div>

<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">カードを追加</h2><button class="close" id="close">×</button></div><div class="form">
<input id="fnum" placeholder="カード番号（例：E1-01）"><input id="fname" placeholder="カード名"><input id="frarity" placeholder="レアリティ"><input id="fseries" placeholder="シリーズ"><input id="fqty" type="number" min="1" value="1" placeholder="所持枚数"><input id="fgive" type="number" min="0" value="0" placeholder="譲渡用枚数"><input id="fwant" type="number" min="0" value="0" placeholder="求めている枚数"><input id="fimage" type="file" accept="image/*"><button class="button" id="saveCard">保存する</button><button class="secondary" id="cancel">キャンセル</button></div></div></div>

<script>
const KEY="aikatsu_cardbook_real_v1";
const seed=Array.from({length:85},(_,i)=>({id:"E1-"+String(i+1).padStart(2,"0"),num:"E1-"+String(i+1).padStart(2,"0"),name:i===0?"オーロラキスキャミソール":i===1?"オーロラキスドレープスカート":"カード E1-"+String(i+1).padStart(2,"0"),rarity:[1,2,3,4,33,34,35,36,51,52,71,72,73,74,75,76,77,78,79,80,81,82].includes(i+1)?"PR":[30,31,32,50].includes(i+1)?"ER":((i+1)<=20||(i+1)>=37&&(i+1)<=40||(i+1)>=53&&(i+1)<=59)?"R":"N"),series:"未設定",qty:i===0?1:i===1?2:0,give:i<2?1:0,want:i===2?1:0,image:""}));
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{cards:seed,history:[]};
if(state.cards.length!==85) state.cards=seed;
let page="cards",trade="give",query="";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("ownedCount").textContent=state.cards.filter(c=>c.qty>0).length;let m=$("main");if(page==="cards")cardsPage(m);else if(page==="trade")tradePage(m);else if(page==="qr")qrPage(m);else if(page==="history")historyPage(m);else homePage(m)}
function pic(c){return `<div class="cardpic">${c.image?`<img src="${c.image}" style="width:100%;height:100%;object-fit:cover">`:`<span class="spark">✦</span>`}<span class="tag rar">${c.rarity}</span><span class="tag have">${c.qty?"♡ 所持":"未所持"}</span></div>`}
function card(c){return `<article class="card"><button data-card="${c.id}">${pic(c)}<div class="ci"><b>${esc(c.name)}</b><small>${esc(c.num)} ・ ${esc(c.series)}</small><div class="qty"><button data-minus="${c.id}">−</button><strong>${c.qty} 枚</strong><button data-plus="${c.id}">＋</button></div></div></button></article>`}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function cardsPage(m){let a=state.cards.filter(c=>(c.name+c.num+c.series+c.rarity).toLowerCase().includes(query.toLowerCase()));m.innerHTML=`<div class="searchrow"><input class="search" id="search" value="${esc(query)}" placeholder="⌕ カード名・番号で検索"><button class="filter" id="clear">×</button></div><div class="panel"><div class="line"><b>${a.length} 件</b><small>85種・番号順</small></div><div class="grid">${a.map(card).join("")}</div></div>`;$("search").oninput=e=>{query=e.target.value;render()};$("clear").onclick=()=>{query="";render()};bindCards()}
function bindCards(){document.querySelectorAll("[data-card]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-plus],[data-minus]"))return;openDetail(b.dataset.card)});document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=e=>{e.stopPropagation();change(b.dataset.plus,1)});document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=e=>{e.stopPropagation();change(b.dataset.minus,-1)})}
function change(id,d){let c=state.cards.find(x=>x.id===id);c.qty=Math.max(0,c.qty+d);state.history.unshift({time:Date.now(),num:c.num,name:c.name,added:d});save();render()}
function openDetail(id){let c=state.cards.find(x=>x.id===id);$("modalTitle").textContent=c.name;$("modal").classList.add("show");$("modal").querySelector(".form").innerHTML=`<div class="cardhero">${c.image?`<img src="${c.image}" style="width:100%;height:100%;object-fit:contain">`:`<span>✦</span>`}</div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.num)} / ${esc(c.rarity)}</div><div class="qty"><button class="secondary" onclick="change('${c.id}',-1)">− 1枚</button><strong>${c.qty} 枚</strong><button class="button" style="width:auto" onclick="change('${c.id}',1)">＋ 1枚</button></div><button class="secondary" onclick="openEdit('${c.id}')">詳細を編集</button>`}
function openEdit(id){let c=state.cards.find(x=>x.id===id);openAdd(c)}
function openAdd(c=null){$("modalTitle").textContent=c?"カードを編集":"カードを追加";$("modal").classList.add("show");$("modal").querySelector(".form").innerHTML=`<input id="fnum" value="${esc(c?.num||"")}" placeholder="カード番号"><input id="fname" value="${esc(c?.name||"")}" placeholder="カード名"><input id="frarity" value="${esc(c?.rarity||"N")}" placeholder="レアリティ"><input id="fseries" value="${esc(c?.series||"未設定")}" placeholder="シリーズ"><input id="fqty" type="number" min="0" value="${c?.qty??1}" placeholder="所持枚数"><input id="fgive" type="number" min="0" value="${c?.give??0}" placeholder="譲渡用枚数"><input id="fwant" type="number" min="0" value="${c?.want??0}" placeholder="求めている枚数"><input id="fimage" type="file" accept="image/*"><button class="button" id="saveCard">${c?"更新する":"保存する"}</button><button class="secondary" id="cancel">キャンセル</button>`;$("cancel").onclick=closeModal;$("saveCard").onclick=()=>saveCard(c?.id)}
async function saveCard(id){let file=$("fimage").files[0],img="";if(file)img=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});let c=id&&state.cards.find(x=>x.id===id);if(!c){c={id:crypto.randomUUID(),num:"",name:"",rarity:"N",series:"未設定",qty:0,give:0,want:0,image:""};state.cards.push(c)}c.num=$("fnum").value.trim();c.name=$("fname").value.trim()||"名称未設定";c.rarity=$("frarity").value.trim()||"N";c.series=$("fseries").value.trim()||"未設定";c.qty=Math.max(0,+$("fqty").value||0);c.give=Math.max(0,+$("fgive").value||0);c.want=Math.max(0,+$("fwant").value||0);if(img)c.image=img;state.history.unshift({time:Date.now(),num:c.num,name:c.name,added:c.qty});save();closeModal();render()}
function closeModal(){$("modal").classList.remove("show")}
function tradePage(m){let a=state.cards.filter(c=>trade==="give"?c.give>0:c.want>0);m.innerHTML=`<div class="panel"><div class="seg"><button class="${trade==="give"?"active":""}" id="give">譲 ${state.cards.filter(c=>c.give>0).length}</button><button class="${trade==="want"?"active":""}" id="want">求 ${state.cards.filter(c=>c.want>0).length}</button></div><div class="grid">${a.map(card).join("")||"<div class='empty'>まだ登録されていないよ</div>"}</div></div>`;$("give").onclick=()=>{trade="give";render()};$("want").onclick=()=>{trade="want";render()};bindCards()}
function qrPage(m){m.innerHTML=`<div class="panel"><div class="qrbox"><div><div class="frame">▦</div><p>カード裏の2次元コードを<br>カメラで読み取ってね</p></div></div><button class="button" style="margin-top:10px" id="scan">▣ カメラを起動</button><button class="secondary" style="margin-top:8px" id="manual">番号を手入力</button><p class="muted">QR読み取りは端末・ブラウザのカメラ許可が必要です。</p></div>`;$("manual").onclick=()=>{let n=prompt("カード番号を入力");if(n){let c=state.cards.find(x=>x.num===n);c?change(c.id,1):openAdd({num:n,name:"新しいカード",rarity:"N",series:"未設定",qty:0,give:0,want:0})}};$("scan").onclick=scan}
function scan(){if(!navigator.mediaDevices?.getUserMedia){alert("この環境ではカメラを利用できません。番号入力を使ってね。");return}navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(stream=>{alert("カメラを起動しました。QR認識機能は次のアップデートで接続できます。");stream.getTracks().forEach(t=>t.stop())}).catch(()=>alert("カメラの許可が必要です。"))}
function historyPage(m){m.innerHTML=`<div class="panel"><div class="line"><b>読み込み履歴</b><small>${state.history.length} 件</small></div><div class="history">${state.history.slice(0,30).map(h=>`<div class="hist"><div class="thumb">✦</div><div><b>${esc(h.num)}</b><small>${esc(h.name)}<br>${new Date(h.time).toLocaleString("ja-JP")}</small></div></div>`).join("")||"<div class='empty'>まだ履歴はないよ</div>"}</div></div>`}
function homePage(m){let o=state.cards.filter(c=>c.qty>0).length,p=(o/85*100).toFixed(1);m.innerHTML=`<div class="panel"><div class="line"><b>コレクション</b><small>85種</small></div><div class="ring"><span>${o} / 85<br><small>${p}%</small></span></div><div class="stats"><div class="stat"><strong>${o}</strong><small>所持</small></div><div class="stat"><strong>${85-o}</strong><small>未所持</small></div><div class="stat"><strong>${state.cards.reduce((n,c)=>n+c.give,0)}</strong><small>譲</small></div><div class="stat"><strong>${state.cards.reduce((n,c)=>n+c.want,0)}</strong><small>求</small></div></div></div>`}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$("fab").onclick=()=>openAdd();$("addBtn").onclick=()=>openAdd();$("close").onclick=closeModal;window.addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});render();
</script>
</body></html>
